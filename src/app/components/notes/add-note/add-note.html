<div class="add-note-container">
  <div class="form-header">
    <div class="form-icon">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M19 13H13V19H11V13H5V11H11V5H13V11H19V13Z" fill="currentColor"/>
      </svg>
    </div>
    <h3>Nueva Nota</h3>
    <p class="form-subtitle">Crea una nueva nota para mantener tus ideas organizadas</p>
  </div>

  <!-- Mensajes de estado -->
  <div *ngIf="errorMessage" class="alert alert-error">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z" fill="currentColor"/>
    </svg>
    {{ errorMessage }}
  </div>
  
  <div *ngIf="successMessage" class="alert alert-success">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z" fill="currentColor"/>
    </svg>
    {{ successMessage }}
  </div>

  <form class="note-form" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="title" class="form-label">Título</label>
      <input 
        type="text" 
        id="title" 
        placeholder="Escribe un título descriptivo"
        class="form-input"
        [(ngModel)]="note.title"
        name="title"
        maxlength="50"
        required
        (input)="onTitleInput()"
        [class.error]="getTitleLength() > 49"
        [disabled]="isLoading"
      >
      <div class="char-counter">
        <span class="char-count" [class.warning]="getTitleLength() > 40" [class.error]="getTitleLength() > 49">
          {{ getTitleLength() }}
        </span>/50
      </div>
    </div>

    <div class="form-group">
      <label for="content" class="form-label">Contenido</label>
      <textarea 
        id="content" 
        placeholder="Describe tu nota aquí... ¡Sé creativo!"
        class="form-textarea"
        [(ngModel)]="note.content"
        name="content"
        maxlength="500"
        required
        (input)="onContentInput()"
        [class.error]="getContentLength() > 490"
        [disabled]="isLoading"
      ></textarea>
      <div class="char-counter">
        <span class="char-count" [class.warning]="getContentLength() > 450" [class.error]="getContentLength() > 490">
          {{ getContentLength() }}
        </span>/500
      </div>
    </div>

    <div class="form-actions">
      <button type="button" class="btn-secondary" (click)="onClear()" [disabled]="isLoading">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M19 6.41L17.59 5L12 10.59L6.41 5L5 6.41L10.59 12L5 17.59L6.41 19L12 13.41L17.59 19L19 17.59L13.41 12L19 6.41Z" fill="currentColor"/>
        </svg>
        Limpiar
      </button>
      <button type="submit" class="btn-primary" [disabled]="isLoading || !isFormValid()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M17 3H5C3.89 3 3 3.9 3 5V19C3 20.1 3.89 21 5 21H19C20.1 21 21 20.1 21 19V7L17 3ZM12 19C10.34 19 9 17.66 9 16C9 14.34 10.34 13 12 13C13.66 13 15 14.34 15 16C15 17.66 13.66 19 12 19ZM15 9H5V5H15V9Z" fill="currentColor"/>
        </svg>
        {{ isLoading ? 'Guardando...' : 'Guardar Nota' }}
      </button>
    </div>
  </form>
</div>
