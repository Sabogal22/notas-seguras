<h3>Agregar nueva nota</h3>
<form>
  <label for="title">Titulo</label>
  <input type="text" id="title" placeholder="Escribe el titulo de la nota">

  <label for="content">Contenido</label>
  <textarea id="content" placeholder="Escribe el contenido de la nota"></textarea>

  <button type="submit">Guardar nota</button>
</form>
