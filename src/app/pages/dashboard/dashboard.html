<div class="dashboard-container">
  <header class="navbar">
    <div class="navbar-content">
      <div class="left">
        <div class="logo">
          <svg
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M19 3H5C3.89 3 3 3.9 3 5V19C3 20.1 3.89 21 5 21H19C20.1 21 21 20.1 21 19V5C21 3.9 20.1 3 19 3ZM9 17H7V10H9V17ZM13 17H11V7H13V17ZM17 17H15V13H17V17Z"
              fill="currentColor"
            />
          </svg>
          <h2>Notas Seguras</h2>
        </div>
      </div>

      <div class="right">
        <div class="user-info">
          <div class="user-avatar">
            {{ getUserInitials() }}
          </div>
          <div class="user-details">
            <span class="username">{{ userName }}</span>
            <span class="user-role {{userRole}}">{{ userRole }}</span>
          </div>
        </div>
        <button class="logout-btn" (click)="logout()">
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M17 7L15.59 8.41L18.17 11H8V13H18.17L15.59 15.58L17 17L22 12L17 7ZM4 5H12V3H4C2.9 3 2 3.9 2 5V19C2 20.1 2.9 21 4 21H12V19H4V5Z"
              fill="currentColor"
            />
          </svg>
          Cerrar Sesión
        </button>
      </div>
    </div>
  </header>

  <!-- Contenido Dividido -->
  <main class="content">
    <!-- Formulario de nueva Nota -->
    <aside class="note-form">
      <div class="panel-header">
        <h3>Nueva Nota</h3>
        <div class="header-decoration"></div>
      </div>
      <app-add-note></app-add-note>
    </aside>

    <!-- Listado de notas -->
    <section class="notes-list">
      <div class="panel-header">
        <h3>Mis Notas</h3>
        <div class="notes-count">{{ notesCount }} notas</div>
      </div>
      <app-list-notes (notesCountChange)="onNotesCountChange($event)"></app-list-notes>
    </section>
  </main>
</div>
